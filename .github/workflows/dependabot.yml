name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable:
    if: >-
      github.repository == 'jessfraz/ha-app-kit' &&
      github.event.pull_request.user.login == 'dependabot[bot]' && github.actor
      == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No pull-request checkout or code executes with this token.
      - name: Require the repository's effective CI protection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/rules/branches/main" > "$RUNNER_TEMP/rules.json"
          jq -e 'any(.[];
            .type == "required_status_checks"
            and .parameters.strict_required_status_checks_policy == true
            and ([.parameters.required_status_checks[].context] as $checks
              | ["Storybook and browser", "Dependency security", "Secret scan", "HA companion"]
              | all(. as $name | $checks | index($name) != null))
          )' "$RUNNER_TEMP/rules.json"
      - name: Merge after required checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --rebase "$PR_URL"
