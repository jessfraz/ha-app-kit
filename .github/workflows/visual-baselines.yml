name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate visual baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix develop --command pnpm install --frozen-lockfile
      - run:
          nix develop --command pnpm exec playwright install --with-deps
          chromium
      - run: nix develop --command pnpm build-storybook
      - run: nix develop --command pnpm test --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/**/*-snapshots/
          if-no-files-found: error
          retention-days: 7
