[project]
name = "ha-app-kit-ha"
version = "0.1.3"
description = "Shared companion repair flows and build tooling"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "aiohasupervisor==0.8.1",
  "gazetteer-matcher==1.2.0",
  "SQLAlchemy==2.0.54",
  "fnv-hash-fast==2.0.3",
  "psutil-home-assistant==0.0.1",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.27",
  "pytest-homeassistant==2026.11.0",
  "ruff==0.17.3",
  "ty==0.0.97",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -p no:respx"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]

[tool.ty.src]
include = ["ha_app_kit", "tests"]
